<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scisor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scisors</h1>
    <div id="gameBoard">
        <img src="rock.png" alt="Rock" id="rock" class="option">
        <img src="paper.png" alt="Paper" id="paper" class="option">    
        <image src="scissors.png" alt="Scissors" id="scissors" class="option"></image>                
    </div>
    <div id="scoreBoard">
        <p>You =</p>
        <p id="userScore"> 0</p>
        <p id="exception">Computer =</p>
        <p id="computerScore"> 0</p>
    </div>
    <div id="choices">
        <p id="userChoice">paper</p>
        <p id="vs">VS</p>
        <p id="computerChoice">scissor</p>
    </div>
    <p id="msg">Welcome!! to the Game</p>
    <script src="script.js"></script>
</body>
</html>
